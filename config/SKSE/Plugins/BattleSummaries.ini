; Battle Summaries. Re-read at game start, or live with BattleSummaries_Native.ReloadSettings().

[General]
bEnabled = true
; Below this share of health an actor counts as having come close to death (0.15 = 15%).
fNearDeathHealthShare = 0.15
; The battle is over once nobody in it has been in combat for this many seconds.
fEndGraceSeconds = 6.0
; Fighting that starts again within this many seconds continues the same battle.
fMergeGapSeconds = 20.0
; Actors further than this from the player (game units) are not tracked.
fTrackingRange = 10000.0
; Bystanders within this distance of the player when a battle ends know what happened in it.
fWitnessRange = 3500.0

[Summary]
; How long after a battle (game hours) its summary is still given to dialogue. After that only the remembered event is left.
fSummaryGameHours = 6.0
; Add raw damage and healing points to the summary. Off: amounts are told in words ("badly hurt", "most of their side's
; damage"), because language models tend to recite any figure they are given.
bShowNumbers = false
iMaxCompanionLines = 6
iMaxEffectsPerList = 6

[Memory]
; Register one persistent SkyrimNet event per battle worth remembering (a paragraph: sides, outcome, kills, rescues).
bRememberBattles = true
; A battle is worth remembering when someone on the player's side fell, went down or came close to death, or it had at
; least this many enemies, or it lasted at least this long.
iMinEnemies = 3
fMinSeconds = 30.0

[Debug]
bVerboseLog = false
